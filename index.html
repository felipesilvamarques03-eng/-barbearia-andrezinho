<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fila da Barbearia</title>
<style>
:root{--bg:#0e0e10;--card:#18181b;--line:#2a2a2f;--gold:#c9a24b;--gold2:#e6c878;--txt:#f2f2f2;--mut:#9a9aa3;--red:#d9534f;--green:#4caf7a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:24px 18px 60px}
#app.wide{max-width:760px}
h1{font-size:28px;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);text-align:center}
h2{font-size:18px;margin-bottom:12px}
.logo{text-align:center;margin:40px 0 8px;font-size:54px}
.sub{color:var(--mut);text-align:center;margin:8px 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,textarea,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#101013;color:var(--txt);font-size:16px;outline:none;font-family:inherit}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
button{cursor:pointer;border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:600;transition:.2s}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;width:100%;margin-top:18px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.sm{padding:9px 14px;font-size:14px;width:auto;margin:0}
.red{background:var(--red);color:#fff}.green{background:var(--green);color:#0e0e10}
.big{font-size:64px;font-weight:700;color:var(--gold2);text-align:center;line-height:1}
.kbig{font-size:34px;font-weight:700;color:var(--gold2)}
.mut{color:var(--mut);font-size:14px}.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#111;font-weight:700;display:grid;place-items:center;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.grow{flex:1;min-width:0}
.name{font-weight:600}.timer{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:700}
.timer.late{color:var(--red)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:#2a2a2f;color:var(--gold2);white-space:nowrap}
.tag.ok{background:rgba(76,175,122,.18);color:#b8f0d0}
.tag.warn{background:rgba(230,200,120,.18);color:var(--gold2)}
.tag.bad{background:rgba(217,83,79,.2);color:#f5b3b0}
.alert{background:rgba(76,175,122,.15);border:1px solid var(--green);color:#b8f0d0;padding:16px;border-radius:14px;text-align:center;font-weight:600}
.back{background:none;color:var(--mut);padding:6px 0;font-size:14px;margin-bottom:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.tab{background:#1f1f24;color:var(--mut);padding:10px 16px;border-radius:999px;font-size:15px;white-space:nowrap}
.tab.on{background:var(--gold);color:#111}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:22px;color:var(--gold2);margin:2px 0}
.kpi small{color:var(--mut);display:block;font-size:12px}
.up{color:var(--green)}.down{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:5px;height:170px;margin-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar{width:100%;background:linear-gradient(var(--gold2),var(--gold));border-radius:6px 6px 0 0;opacity:.75}
.bar.hoje{opacity:1}
.bv{font-size:10px;color:var(--mut)}.bl{font-size:11px;color:var(--mut)}
.trow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.trow:last-child{border:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:#1f1f24;color:var(--txt);border:1px solid var(--line);padding:9px 14px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px;border:1px solid var(--line);max-height:92vh;overflow-y:auto}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.4}
.banner.info{background:rgba(201,162,75,.14);border:1px solid var(--gold);color:var(--gold2)}
.banner.alerta{background:rgba(217,83,79,.15);border:1px solid var(--red);color:#f5b3b0}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg button{background:#1f1f24;color:var(--txt);border:1px solid var(--line);padding:10px 16px;font-size:15px}
.seg button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(260px,100%);margin:12px auto;display:block}
.qr svg{display:block;width:100%;height:auto}
.copia{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:var(--mut);background:#101013;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.planos{display:grid;gap:10px}
.plano{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.plano.atual{border-color:var(--gold)}
.plano ul{margin:8px 0 0 18px;color:var(--mut);font-size:14px;line-height:1.6}
.preco{font-size:26px;font-weight:700;color:var(--gold2)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--txt)}
.chk input{width:auto;margin-top:3px}
.neg{color:var(--red)}.pos{color:var(--green)}
</style>
</head>

const ascii = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 .\-]/g, '').replace(/\s+/g, ' ').trim();
function pixCopiaECola({ chave, nome, cidade, valor, txid }){
  const conta = tlv('00', 'br.gov.bcb.pix') + tlv('01', chave);
  let p = tlv('00', '01') + tlv('26', conta) + tlv('52', '0000') + tlv('53', '986')

}

const isoDia = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const idade = nasc => { const n = parseDia(nasc), h = new Date(); let a = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) a--; return a; };
const fmtCpf = c => String(c || '').replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
const cpfOculto = c => String(c || '').replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '***.$2.$3-**');
const maskCpf = v => { const d = digits(v).slice(0, 11);
  return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2'); };
function cpfValido(c){
  c = digits(c); if (!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += Number(c[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(c[9]) && dv(10) === Number(c[10]);
}

async function rpc(fn, args = {}) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const t = await r.text();
  if (!r.ok) {
    let m = ''; try { m = JSON.parse(t).message || ''; } catch {}
    const e = new Error(m || ('HTTP ' + r.status)); e.code = m; throw e;
  }
  return t ? JSON.parse(t) : null;
}

/*ANALYTICS-START*/
const DAY = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };   // semana começa na segunda
const startOfMonth = d => { const x = startOfDay(d); x.setDate(1); return x; };
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / DAY);

function somar(rows, de, ate){
  let total = 0, qtd = 0;
  for (const r of rows) { const t = new Date(r.finalizado_em); if (t >= de && t < ate) { total += Number(r.valor || 0); qtd++; } }
  return { total, qtd };
}
function variacao(atual, anterior){ if (!anterior) return atual ? null : 0; return (atual - anterior) / anterior * 100; }   // null = sem base de comparação

function resumoFaturamento(rows, agora = new Date()){
  const hoje0 = startOfDay(agora), amanha = addDays(hoje0, 1);
  const hoje = somar(rows, hoje0, amanha), ontem = somar(rows, addDays(hoje0, -1), hoje0);
  const sem0 = startOfWeek(agora), semAnt0 = addDays(sem0, -7), decorridos = dayDiff(hoje0, sem0) + 1;
  const sem = somar(rows, sem0, amanha), semAnt = somar(rows, semAnt0, addDays(semAnt0, decorridos));
  const mes0 = startOfMonth(agora), mesAnt0 = new Date(mes0.getFullYear(), mes0.getMonth() - 1, 1);
  const diasMesAnt = new Date(mesAnt0.getFullYear(), mesAnt0.getMonth() + 1, 0).getDate();
  const mes = somar(rows, mes0, amanha);
  const mesAnt = somar(rows, mesAnt0, new Date(mesAnt0.getFullYear(), mesAnt0.getMonth(), Math.min(agora.getDate(), diasMesAnt) + 1));
  const d30 = somar(rows, addDays(hoje0, -29), amanha);
  return { hoje, ontem, sem, semAnt, mes, mesAnt, d30, ticket: d30.qtd ? d30.total / d30.qtd : 0 };
}
function serieDiaria(rows, dias = 14, agora = new Date()){
  const hoje0 = startOfDay(agora), out = [];
  for (let i = dias - 1; i >= 0; i--) { const d = addDays(hoje0, -i); out.push({ dia: d, ...somar(rows, d, addDays(d, 1)) }); }
  return out;
}
function serieSemanal(rows, semanas = 8, agora = new Date()){
  const sem0 = startOfWeek(agora), out = [];
  for (let i = semanas - 1; i >= 0; i--) { const ini = addDays(sem0, -7 * i); out.push({ inicio: ini, parcial: i === 0, ...somar(rows, ini, addDays(ini, 7)) }); }
  return out;
}
function porServico(rows, dias = 30, agora = new Date()){
  const de = addDays(startOfDay(agora), -(dias - 1)), ate = addDays(startOfDay(agora), 1), m = new Map();
  for (const r of rows) {
    const t = new Date(r.finalizado_em); if (t < de || t >= ate) continue;
    const k = r.servico || 'Sem serviço', x = m.get(k) || { servico: k, qtd: 0, total: 0 };
    x.qtd++; x.total += Number(r.valor || 0); m.set(k, x);
  }
  return [...m.values()].sort((a, b) => b.total - a.total);
}
function porForma(rows, dias = 30, agora = new Date()){
  const de = addDays(startOfDay(agora), -(dias - 1)), ate = addDays(startOfDay(agora), 1);
  const m = { dinheiro: 0, pix: 0, cartao: 0, '': 0 }, q = { dinheiro: 0, pix: 0, cartao: 0, '': 0 };
  for (const r of rows) {
    const t = new Date(r.finalizado_em); if (t < de || t >= ate) continue;
    const k = r.forma_pagamento in m ? r.forma_pagamento : '';
    m[k] += Number(r.valor || 0); q[k]++;
  }
  return Object.keys(m).filter(k => k || q[k]).map(k => ({ forma: k, rotulo: FORMAS[k] || 'Não informado', total: m[k], qtd: q[k] }));
}

// repasses de um mês: quanto cada profissional produziu, quanto fica com ele, aluguel e salário
function repassesDoMes(rows, profs, ano, mes){
  const ini = new Date(ano, mes, 1), fim = new Date(ano, mes + 1, 1), diasMes = Math.round((fim - ini) / DAY);
  let receita = 0, qtd = 0; const prod = new Map(), formas = { dinheiro: 0, pix: 0, cartao: 0, '': 0 };
  for (const r of rows) {
    const t = new Date(r.finalizado_em); if (t < ini || t >= fim) continue;
    const v = Number(r.valor || 0); receita += v; qtd++;
    formas[r.forma_pagamento in formas ? r.forma_pagamento : ''] += v;
    if (r.profissional_id) { const x = prod.get(r.profissional_id) || { total: 0, qtd: 0 }; x.total += v; x.qtd++; prod.set(r.profissional_id, x); }
  }
  const linhas = [];
  for (const p of profs) {
    const noMes = parseDia(p.inicio) < fim && (!p.saida || parseDia(p.saida) >= ini);
    const pr = prod.get(p.id) || { total: 0, qtd: 0 };
    if (!noMes && !pr.qtd) continue;
    const pct = Number(p.comissao_pct || 0);
    const parte = p.tipo === 'comissao' || p.tipo === 'aluguel_comissao' ? pr.total * pct / 100 : p.tipo === 'aluguel' ? pr.total : 0;
    const aluguel = (p.tipo === 'aluguel' || p.tipo === 'aluguel_comissao') && noMes
      ? (p.aluguel_periodo === 'mensal' ? Number(p.aluguel_valor || 0) : Number(p.aluguel_valor || 0) * diasMes / 7) : 0;
    const salario = p.tipo === 'salario' && noMes ? Number(p.salario || 0) : 0;
    linhas.push({ p, producao: pr.total, atend: pr.qtd, parte, aluguel, salario, casa: pr.total - parte + aluguel - salario });
  }
  const soma = k => linhas.reduce((s, l) => s + l[k], 0);
  return { receita, qtd, formas, linhas, parte: soma('parte'), aluguel: soma('aluguel'), salario: soma('salario'), diasMes };
}

function analisarClientes(rows, agora = new Date(), cfg = CONFIG.ROTINA){
  const por = new Map();
  for (const r of rows) {   // rows vem do mais recente para o mais antigo: o primeiro nome visto é o mais atual
    let c = por.get(r.telefone);
    if (!c) { c = { telefone: r.telefone, nome: r.nome, dias: new Map(), total: 0 }; por.set(r.telefone, c); }
    c.dias.set(dayKey(r.finalizado_em), startOfDay(r.finalizado_em)); c.total += Number(r.valor || 0);
  }
  const hoje = startOfDay(agora), lista = [];
  for (const c of por.values()) {
    const dias = [...c.dias.values()].sort((a, b) => a - b), n = dias.length, ultima = dias[n - 1];
    const gaps = []; for (let i = 1; i < n; i++) gaps.push(dayDiff(dias[i], dias[i - 1]));
    const media = gaps.length ? gaps.reduce((s, g) => s + g, 0) / gaps.length : null;
    const ciclo = media === null ? null : Math.max(media, cfg.cicloMinimo);
    const desde = dayDiff(hoje, ultima);
    let status;
    if (n === 1) status = desde <= cfg.novoAteDias ? 'novo' : 'sumido';
    else if (desde <= ciclo * cfg.margem) status = 'rotina';
    else if (desde <= ciclo * cfg.sumido) status = 'atrasado';
    else status = 'sumido';
    let espacando = false;
    if (n >= 4) {
      const antes = gaps.slice(0, -1), mAnt = antes.reduce((s, g) => s + g, 0) / antes.length;
      espacando = gaps[gaps.length - 1] >= Math.max(mAnt * 1.5, mAnt + 5);
    }
    lista.push({ telefone: c.telefone, nome: c.nome, visitas: n, total: c.total, ciclo: media === null ? null : Math.round(media),
      desde, status, espacando, ultima, proxima: ciclo ? addDays(ultima, Math.round(ciclo)) : null });
  }
  const peso = { atrasado: 0, sumido: 1, rotina: 2, novo: 3 };
  lista.sort((a, b) => (peso[a.status] - peso[b.status]) || ((b.desde - (b.ciclo || 0)) - (a.desde - (a.ciclo || 0))));
  return lista;
}
function contagemClientes(lista){
  const c = { rotina: 0, atrasado: 0, sumido: 0, novo: 0, espacando: 0 };
  for (const x of lista) { c[x.status]++; if (x.espacando) c.espacando++; }
  return c;
}

const S = { token: null, papel: null, need: 'barbeiro', tab: 'fila', fila: [], atend: [], busca: '',
            conta: null, profs: [], profDet: [], desp: [], planos: [], rel: { modo: 'mes', ano: new Date().getFullYear(), mes: new Date().getMonth() },
            despMes: null, fin: null };
const expirando = new Set();
const restante = f => Math.max(0, SHOP.tolerancia_min * 60 - Math.floor((Date.now() - new Date(f.chamado_em)) / 1000));
const nivel = () => (S.conta && S.conta.nivel) || 1;
const bloqueada = () => S.conta && S.conta.situacao === 'bloqueado';
function tabsDisponiveis(){
  const dono = S.papel === 'dono';
  if (bloqueada()) return dono ? ['plano'] : [];
  const t = ['fila'];
  if (nivel() >= 2) t.push('fat', 'cli');
  if (dono && nivel() >= 2) t.push('equipe');
  if (dono && nivel() >= 3) t.push('despesas', 'relatorios');

}
const ROTULO_TAB = { fila: 'Fila', fat: 'Faturamento', cli: 'Clientes', equipe: 'Equipe', despesas: 'Despesas',
  relatorios: 'Relatórios', ajustes: 'Ajustes', senhas: 'Senhas', plano: 'Plano' };
const NOME_PLANO = { basic: 'Basic', pro: 'Pro', expert: 'Expert' };
const SS = {
  get(k){ try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { sessionStorage.setItem(k, v); } catch {} },
  del(k){ try { sessionStorage.removeItem(k); } catch {} }
};
const tokKey = () => 'bb_token_' + SHOP.slug, papelKey = () => 'bb_papel_' + SHOP.slug;

function adminErr(e){
  if (e && (e.code === 'nao_autorizado' || e.code === 'barbearia_inativa')) { logout(); return true; }
  if (e && (e.code === 'assinatura_vencida' || e.code === 'plano_insuficiente')) {   // plano mudou ou venceu: recarrega o painel
    clearTimers(); $modal.innerHTML = ''; startAdmin(); return true;
  }
  console.error(e); return false;
}

function adminView(need){
  S.need = need;
  S.token = SS.get(tokKey()); S.papel = SS.get(papelKey());
  if (!S.token) return loginView();
  if (need === 'dono' && S.papel !== 'dono') return loginView('Esta área é só do dono.');
  startAdmin();
}

function loginView(aviso = ''){
  $app.className = ''; $modal.innerHTML = '';
  $app.innerHTML = `<div class="logo">🔒</div><h1>${S.need === 'dono' ? 'Área do dono' : 'Área do barbeiro'}</h1>
    <p class="sub">${esc(SHOP.nome)}</p>
    <div class="card"><label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err">${esc(aviso)}</div><button class="btn" id="ok">Entrar</button></div>`;
  const go = async () => {
    const pw = document.getElementById('pw').value, err = document.getElementById('err');
    err.textContent = ''; if (!pw) return;
    try {
      const r = await rpc('adm_login', {p_slug: SHOP.slug, p_pin: pw});
      if (!r || !r.length) return err.textContent = 'Senha incorreta.';
      if (S.need === 'dono' && r[0].out_papel !== 'dono') {
        rpc('adm_sair', {p_token: r[0].out_token}).catch(() => {});
        return err.textContent = 'Esta área é só do dono.';
      }
      SS.set(tokKey(), r[0].out_token); SS.set(papelKey(), r[0].out_papel);
      adminView(S.need);
    } catch (e) { err.textContent = msgErro(e); }
  };
  document.getElementById('ok').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => e.key === 'Enter' && go());
}

function logout(){
  const t = S.token;
  SS.del(tokKey()); SS.del(papelKey());
  S.token = null; S.papel = null; clearTimers(); $app.onclick = null; $modal.onclick = null; $modal.innerHTML = '';
  if (t) rpc('adm_sair', {p_token: t}).catch(() => {});

}

async function carregarConta(){
  const r = await rpc('adm_conta', {p_token: S.token});
  S.conta = r && r[0] ? r[0] : null;
  if (!S.conta) throw Object.assign(new Error('nao_autorizado'), { code: 'nao_autorizado' });
}

async function startAdmin(){
  $app.className = 'wide';
  $app.innerHTML = '<p class="sub">Carregando…</p>';
  try { await carregarConta(); } catch (e) { if (!adminErr(e)) $app.innerHTML = `<p class="err">${esc(msgErro(e))}</p>`; return; }
  try { S.planos = await rpc('planos_lista') || []; } catch { S.planos = []; }
  if (bloqueada() && S.papel !== 'dono') {
    $app.className = '';
    $app.innerHTML = `<div class="logo">⏸️</div><h1>Painel pausado</h1><p class="sub">${esc(ERROS.assinatura_vencida)}</p>
      <button class="btn ghost" data-a="logout">Sair</button>`;
    $app.onclick = onAdminClick; return;
  }
  if (!tabsDisponiveis().includes(S.tab)) S.tab = tabsDisponiveis()[0];
  shell();
  $app.onclick = onAdminClick; $modal.onclick = onModalClick;
  if (!bloqueada()) {
    await Promise.all([carregarFila(), nivel() >= 2 ? carregarAtend() : null, nivel() >= 2 ? carregarProfs() : null,
                       S.papel === 'dono' && nivel() >= 2 ? carregarProfDet() : null,
                       S.papel === 'dono' && nivel() >= 3 ? carregarDesp() : null]);
  }
  renderTab();
  if (bloqueada()) return;
  timers.push(setInterval(() => { if (S.tab === 'fila') carregarFila(); }, 4000));
  timers.push(setInterval(async () => {
    if (nivel() < 2) return;
    await carregarAtend();
    if (S.tab === 'cli') renderCliLista(); else if (S.tab === 'fat' || S.tab === 'fila') renderTab();
  }, 60000));
  timers.push(setInterval(tickTimers, 1000));
}

function renderTab(){

function tickTimers(){
  if (S.tab !== 'fila') return;
  for (const f of S.fila) {
    if (f.status !== 'chamado' || !f.chamado_em) continue;
    const s = restante(f), el = document.querySelector(`[data-t="${f.id}"]`);
    if (el) { el.textContent = '⏱ ' + mmss(s); el.classList.toggle('late', s < 60); }
    if (s === 0 && !expirando.has(f.id)) {
      expirando.add(f.id);
      rpc('adm_remover', {p_token: S.token, p_id: f.id}).then(carregarFila).catch(adminErr);

async function onModalClick(e){
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'fcancel') { $modal.innerHTML = ''; return; }
  if (a === 'copiar') {
    const t = document.getElementById('pix-txt').textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = 'Copiado!'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('pix-txt')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    return;
  }
  if (a === 'svc') {
    const s = SHOP.servicos[Number(b.dataset.i)]; if (!s) return;
    document.getElementById('f-serv').value = s.nome;
    document.getElementById('f-val').value = String(s.preco).replace('.', ',');
    return;
  }
  if (a === 'forma') {
    S.fin.forma = b.dataset.f;
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    return;
  }
  if (a === 'fok') {
    const err = document.getElementById('f-err'); err.textContent = '';
    const val = parseValor(document.getElementById('f-val').value);
    if (val === null) return err.textContent = 'Digite um valor válido (ex.: 35 ou 35,50).';

    if (sel && !prof) return err.textContent = 'Escolha quem atendeu.';
    if (!S.fin.forma) return err.textContent = 'Escolha a forma de pagamento.';
    const forma = S.fin.forma, cliente = S.fin.nome;
    b.disabled = true;
    try {
      await rpc('adm_finalizar', {p_token: S.token, p_id: Number(b.dataset.id), p_servico: document.getElementById('f-serv').value.trim(),

      if (forma === 'pix' && val > 0) mostrarPix(val, prof, cliente);
      await Promise.all([carregarFila(), nivel() >= 2 ? carregarAtend() : null]); renderTab();
    } catch (ex) { b.disabled = false; if (!adminErr(ex)) err.textContent = msgErro(ex); }
    return;
  }

}

/* ---------- Aba Faturamento ---------- */
const varTag = p => p === null ? '<span class="mut">sem base</span>'
  : (p >= 0 ? `<span class="up">▲ ${p.toFixed(0)}%</span>` : `<span class="down">▼ ${Math.abs(p).toFixed(0)}%</span>`);
const kpi = (rot, valor, sub) => `<div class="kpi"><small>${rot}</small><b>${valor}</b><small>${sub}</small></div>`;

function viewFat(){
  if (!S.atend.length) return `<div class="card center"><p class="mut">Ainda não há atendimentos finalizados. Toque em “Finalizar” na fila para registrar o valor de cada atendimento.</p></div>`;
  const r = resumoFaturamento(S.atend), dias = serieDiaria(S.atend, 14), semanas = serieSemanal(S.atend, 8), serv = porServico(S.atend, 30);
  const max = Math.max(...dias.map(d => d.total), 1);
  return `<div class="kpis">
      ${kpi('Hoje', brl(r.hoje.total), `${r.hoje.qtd} atend. · ${varTag(variacao(r.hoje.total, r.ontem.total))} vs ontem`)}
      ${kpi('Esta semana', brl(r.sem.total), `${r.sem.qtd} atend. · ${varTag(variacao(r.sem.total, r.semAnt.total))} vs mesmo período da semana passada`)}
      ${kpi('Este mês', brl(r.mes.total), `${r.mes.qtd} atend. · ${varTag(variacao(r.mes.total, r.mesAnt.total))} vs mesmo período do mês passado`)}
      ${kpi('Ticket médio (30 dias)', brl(r.ticket), `${r.d30.qtd} atend. · ${brl(r.d30.total)} no total`)}
    </div>
    <div class="card"><h2>Últimos 14 dias</h2>
      <div class="bars">${dias.map((d, i) => `<div class="bcol"><div class="bv">${d.total ? curto(d.total) : ''}</div>
        <div class="bar${i === dias.length - 1 ? ' hoje' : ''}" style="height:${Math.max(d.total / max * 120, d.total ? 4 : 1)}px"></div>
        <div class="bl">${String(d.dia.getDate()).padStart(2, '0')}</div></div>`).join('')}</div></div>
    <div class="card"><h2>Semana a semana (seg–dom)</h2>
      ${semanas.map((w, i) => { const ant = semanas[i - 1];
        return `<div class="trow"><span>${dm(w.inicio)} – ${dm(addDays(w.inicio, 6))}</span><span>${brl(w.total)} · ${w.qtd} atend.</span>
        <span>${w.parcial ? '<span class="mut">em andamento</span>' : (ant ? varTag(variacao(w.total, ant.total)) : '')}</span></div>`; }).reverse().join('')}</div>
    <div class="card"><h2>Por serviço (30 dias)</h2>
      ${serv.length ? serv.map(s => `<div class="trow"><span>${esc(s.servico)}</span><span>${s.qtd}x · ${brl(s.total)}</span></div>`).join('') : '<p class="mut">Sem dados.</p>'}</div>
    <div class="card"><h2>Por forma de pagamento (30 dias)</h2>
      ${porForma(S.atend, 30).map(x => `<div class="trow"><span>${x.rotulo}</span><span>${x.qtd}x · ${brl(x.total)}</span></div>`).join('')}</div>
    ${S.papel === 'dono' ? `<div class="card"><h2>Últimos atendimentos (só o dono corrige)</h2>
      ${S.atend.slice(0, 12).map(a => `<div class="item"><div class="grow"><div class="name">${esc(a.nome)} · ${brl(a.valor)}</div>

        <button class="btn ghost sm" data-a="edval" data-id="${a.id}">Editar</button>
        <button class="red sm" data-a="delat" data-id="${a.id}">Excluir</button></div>`).join('')}</div>` : ''}`;
}

/* ---------- Aba Clientes ---------- */
function viewCli(){
  if (!S.atend.length) return `<div class="card center"><p class="mut">A rotina dos clientes aparece aqui depois dos primeiros atendimentos finalizados.</p></div>`;

function renderCliLista(){
  const el = document.getElementById('clilist'); if (!el) return;
  const q = S.busca, qd = digits(q);
  const lista = analisarClientes(S.atend).filter(c => !q || c.nome.toLowerCase().includes(q) || (qd && c.telefone.includes(qd)));

function descTipo(p){

  if (p.tipo === 'comissao') return `Comissão: recebe ${pctTxt(p.comissao_pct)} de cada atendimento`;
  if (p.tipo === 'aluguel') return `Aluguel de cadeira: paga ${alug()} e fica com os atendimentos`;
  if (p.tipo === 'aluguel_comissao') return `Paga ${alug()} e recebe ${pctTxt(p.comissao_pct)} de cada atendimento`;
  if (p.tipo === 'salario') return `Salário fixo de ${brl(p.salario)} por mês`;

async function salvarProfissional(b){
  const g = id => document.getElementById(id), err = g('p-err'); err.textContent = '';
  const num = id => { const x = parseValor(g(id).value); return x === null ? null : x; };
  const dados = {
    id: b.dataset.id || null, nome: g('p-nome').value.trim(), apelido: g('p-apelido').value.trim(),
    cpf: digits(g('p-cpf').value), nascimento: g('p-nasc').value, telefone: digits(g('p-tel').value),
    funcao: g('p-funcao').value.trim(), email: g('p-email').value.trim(), endereco: g('p-end').value.trim(),
    inicio: g('p-inicio').value || null, tipo: g('p-tipo').value,
    comissao_pct: num('p-pct'), aluguel_valor: num('p-alug'), aluguel_periodo: g('p-per').value, salario: num('p-sal'),
    pix_tipo: g('p-pixt').value || null, pix_chave: g('p-pix').value.trim(), recebe_direto: g('p-direto').checked,
    obs: g('p-obs').value.trim(), ativo: g('p-ativo') ? g('p-ativo').checked : true
  };
  if (dados.nome.split(/\s+/).length < 2) return err.textContent = ERROS.nome_completo;
  if (!cpfValido(dados.cpf)) return err.textContent = ERROS.cpf_invalido;
  if (!dados.nascimento) return err.textContent = ERROS.nascimento_invalido;
  if (dados.pix_tipo && !dados.pix_chave) return err.textContent = 'Digite a chave Pix ou escolha "Sem chave".';
  if (dados.recebe_direto && !dados.pix_tipo) return err.textContent = 'Para receber direto, cadastre a chave Pix dele.';
  try {
    await rpc('dono_salvar_profissional', {p_token: S.token, p: dados});
    $modal.innerHTML = '';
    await Promise.all([carregarProfDet(), carregarProfs()]); renderTab();
  } catch (ex) { if (!adminErr(ex)) err.textContent = msgErro(ex); }
}

function despesasDoMes(ano, mes){
  return S.desp.filter(d => { const t = parseDia(d.data); return t.getFullYear() === ano && t.getMonth() === mes; });
}
function navMes(acao, ano, mes){
  return `<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-a="${acao}" data-d="-1">◀</button>

}
function viewDespesas(){

}

/* ---------- Aba Relatórios (Expert, só o dono) ---------- */
function resumoMes(ano, mes){
  const r = repassesDoMes(S.atend, S.profDet, ano, mes);
  const desp = despesasDoMes(ano, mes), totDesp = desp.reduce((s, d) => s + Number(d.valor), 0);
  const porCat = {}; desp.forEach(d => porCat[d.categoria] = (porCat[d.categoria] || 0) + Number(d.valor));
  const lucro = r.receita - r.parte - r.salario + r.aluguel - totDesp;
  return { ...r, totDesp, porCat, lucro };
}
const linhaR = (rot, v, cls = '') => `<div class="trow"><span>${rot}</span><span class="${cls}">${v}</span></div>`;
function viewRelatorios(){
  const R = S.rel, seg = `<div class="seg"><button data-a="rmodo" data-m="mes" class="${R.modo === 'mes' ? 'on' : ''}">Mensal</button>
    <button data-a="rmodo" data-m="ano" class="${R.modo === 'ano' ? 'on' : ''}">Anual</button></div>`;
  if (R.modo === 'mes') {
    const x = resumoMes(R.ano, R.mes);
    return `${seg}${navMes('rmes', R.ano, R.mes)}
      <div class="kpis">${kpi('Receita', brl(x.receita), `${x.qtd} atendimento(s)`)}
        ${kpi('Lucro', `<span class="${x.lucro < 0 ? 'neg' : ''}">${brl(x.lucro)}</span>`, 'receita − repasses − despesas')}
        ${kpi('Despesas', brl(x.totDesp), `${Object.keys(x.porCat).length} categoria(s)`)}
        ${kpi('Ticket médio', brl(x.qtd ? x.receita / x.qtd : 0), 'por atendimento')}</div>
      <div class="card"><h2>Resultado do mês</h2>
        ${linhaR('Receita dos atendimentos', brl(x.receita))}
        ${linhaR('(−) Comissões e parte dos profissionais', '− ' + brl(x.parte), 'neg')}
        ${linhaR('(−) Salários', '− ' + brl(x.salario), 'neg')}
        ${linhaR('(+) Aluguel de cadeiras', '+ ' + brl(x.aluguel), 'pos')}
        ${linhaR('(−) Despesas', '− ' + brl(x.totDesp), 'neg')}
        ${linhaR('<b>Lucro</b>', `<b>${brl(x.lucro)}</b>`, x.lucro < 0 ? 'neg' : 'pos')}</div>
      <div class="card"><h2>Formas de pagamento</h2>
        ${Object.entries(x.formas).filter(([k, v]) => k || v).map(([k, v]) => linhaR(FORMAS[k] || 'Não informado', brl(v))).join('')}</div>
      ${x.linhas.length ? `<div class="card"><h2>Por profissional</h2>
        ${x.linhas.map(l => `<div class="trow"><span>${esc(l.p.apelido || l.p.nome.split(' ')[0])}<br><span class="mut">${l.atend} atend. · ${TIPOS[l.p.tipo]}</span></span>
          <span style="text-align:right">Produziu ${brl(l.producao)}<br><span class="mut">fica p/ casa ${brl(l.casa)}</span></span></div>`).join('')}</div>` : ''}
      <div class="card"><h2>Despesas por categoria</h2>
        ${Object.keys(x.porCat).length ? Object.entries(x.porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => linhaR(esc(c), brl(v))).join('') : '<p class="mut">Nenhuma despesa lançada.</p>'}</div>
      <p class="mut">O aluguel semanal é estimado pelos dias do mês ÷ 7. Atendimentos sem "quem atendeu" contam inteiros para a barbearia.</p>`;
  }
  const meses = MESES.map((_, m) => ({ m, ...resumoMes(R.ano, m) }));
  const tot = k => meses.reduce((s, x) => s + x[k], 0);
  const rep = x => x.parte + x.salario - x.aluguel;
  return `${seg}<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-a="rano" data-d="-1">◀</button>
      <b>${R.ano}</b><button class="btn ghost sm" data-a="rano" data-d="1">▶</button></div>
    <div class="kpis">${kpi('Receita do ano', brl(tot('receita')), `${tot('qtd')} atendimento(s)`)}
      ${kpi('Lucro do ano', `<span class="${tot('lucro') < 0 ? 'neg' : ''}">${brl(tot('lucro'))}</span>`, `despesas ${brl(tot('totDesp'))}`)}</div>
    <div class="card"><h2>Mês a mês</h2>
      <div class="trow mut"><span>Mês</span><span>Receita</span><span>Repasses</span><span>Despesas</span><span>Lucro</span></div>
      ${meses.map(x => `<div class="trow" style="font-size:13px"><span>${MESES[x.m].slice(0, 3)}</span><span>${curto(x.receita)}</span>
        <span>${curto(rep(x))}</span><span>${curto(x.totDesp)}</span><span class="${x.lucro < 0 ? 'neg' : ''}">${x.lucro < 0 ? '−' : ''}${curto(Math.abs(x.lucro))}</span></div>`).join('')}
      <div class="trow"><b>Total</b><b>${curto(tot('receita'))}</b><b>${curto(meses.reduce((s, x) => s + rep(x), 0))}</b><b>${curto(tot('totDesp'))}</b><b>${curto(tot('lucro'))}</b></div></div>
    <p class="mut">Valores em reais (k = mil). Repasses = comissões + salários − aluguéis recebidos.</p>`;
}

async function chamarAssinatura(corpo){
  const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/assinar`, {
    method: 'POST',
    headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: S.token, ...corpo })
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 404) j.erro = 'mp_nao_configurado';
  if (!r.ok || j.erro) { const e = new Error(j.erro || 'erro'); e.code = j.erro; throw e; }
  return j;
}

/* ---------- Aba Ajustes (só o dono) ---------- */
const servicosTexto = lista => lista.map(s => `${s.nome} = ${String(s.preco).replace('.', ',')}`).join('\n');
function lerServicos(txt){
  const out = [];
  for (const linha of String(txt || '').split('\n')) {
    if (!linha.trim()) continue;
    const m = linha.match(/^(.+?)\s*[=:]\s*(?:R\$\s*)?([\d.,]+)\s*$/i);
    if (!m) return null;
    const preco = parseValor(m[2]), nome = m[1].trim();
    if (preco === null || preco > 10000 || !nome || nome.length > 40) return null;
    out.push({ nome, preco });
  }
  return out.length && out.length <= 20 ? out : null;
}

async function onAdminClick(e){
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id ? Number(b.dataset.id) : null;
  try {
    if (a === 'tab') { S.tab = b.dataset.t; shell(); renderTab(); return; }
    if (a === 'logout') return logout();
    if (a === 'chamar') {
      const f = S.fila.find(x => x.id === id); if (!f) return;
      const msg = `Fala ${f.nome}! 💈 Chegou a sua vez aqui na ${SHOP.nome}. Por favor, compareça à cadeira em até ${SHOP.tolerancia_min} minutos para não perder a vez.`;
      window.open(`https://wa.me/55${f.telefone}?text=${encodeURIComponent(msg)}`, '_blank');
      await rpc('adm_chamar', {p_token: S.token, p_id: id}); return carregarFila();
    }
    if (a === 'remover') { await rpc('adm_remover', {p_token: S.token, p_id: id}); return carregarFila(); }
    if (a === 'finalizar') { const f = S.fila.find(x => x.id === id); if (f) abrirFinalizar(f); return; }
    if (a === 'voltar') {
      const msg = `Fala ${b.dataset.nome}! 💈 Faz um tempinho que você não passa aqui na ${SHOP.nome}. Bora cuidar do visual? Me chama que eu encaixo você.`;
      window.open(`https://wa.me/55${b.dataset.tel}?text=${encodeURIComponent(msg)}`, '_blank'); return;
    }
    if (a === 'edval') {
      const at = S.atend.find(x => x.id === id); if (!at) return;
      const v = prompt('Novo valor (R$) para ' + at.nome, String(at.valor).replace('.', ',')); if (v === null) return;
      const n = parseValor(v); if (n === null) return alert('Valor inválido.');
      await rpc('dono_editar_valor', {p_token: S.token, p_id: id, p_valor: n});
      await carregarAtend(); return renderTab();
    }
    if (a === 'delat') {
      if (!confirm('Excluir este atendimento do faturamento?')) return;
      await rpc('dono_excluir_atendimento', {p_token: S.token, p_id: id});
      await carregarAtend(); return renderTab();
    }
    if (a === 'trocar') {
      const quem = b.dataset.quem, inp = document.getElementById('np-' + quem), msg = document.getElementById('pw-msg');
      msg.className = 'err'; msg.textContent = '';
      if (inp.value.length < 6) return msg.textContent = ERROS.senha_curta;
      const novo = inp.value;
      await rpc('dono_trocar_pin', {p_token: S.token, p_quem: quem, p_novo: novo});
      inp.value = '';
      if (quem === 'dono') {   // a troca encerra as sessões do dono: entra de novo com a senha nova
        const r = await rpc('adm_login', {p_slug: SHOP.slug, p_pin: novo});
        if (!r || !r.length) return logout();
        S.token = r[0].out_token; SS.set(tokKey(), S.token);
      }
      msg.className = 'tag ok'; msg.textContent = 'Senha salva.';
    }
    if (a === 'salvar-aj') {
      const msg = document.getElementById('aj-msg'); msg.className = 'err'; msg.textContent = '';
      const nome = document.getElementById('aj-nome').value.trim();
      const serv = lerServicos(document.getElementById('aj-serv').value);
      const min = parseInt(document.getElementById('aj-min').value, 10), tol = parseInt(document.getElementById('aj-tol').value, 10);
      if (nome.length < 2) return msg.textContent = 'Informe o nome da barbearia.';
      if (!serv) return msg.textContent = ERROS.servicos_invalidos;
      if (!(min >= 5 && min <= 240) || !(tol >= 1 && tol <= 60)) return msg.textContent = ERROS.ajuste_invalido;
      const cidade = document.getElementById('aj-cidade').value.trim(), pixT = document.getElementById('aj-pixt').value || null;
      const pixC = document.getElementById('aj-pix').value.trim(), pixN = document.getElementById('aj-pixn').value.trim();
      if (pixT && !pixC) return msg.textContent = 'Digite a chave Pix ou escolha "Sem chave".';
      if (pixT && pixN.length < 2) return msg.textContent = ERROS.pix_nome;
      try {
        await rpc('dono_ajustes', {p_token: S.token, p_nome: nome, p_servicos: serv, p_min: min, p_tol: tol,
                                   p_cidade: cidade || null, p_pix_tipo: pixT, p_pix_chave: pixC || null, p_pix_nome: pixN || null});
      } catch (ex) { if (!adminErr(ex)) msg.textContent = msgErro(ex); return; }
      SHOP = { ...SHOP, nome, servicos: serv, min_por_cliente: min, tolerancia_min: tol };
      await carregarConta();
      document.title = SHOP.nome; shell(); renderTab();
      const m2 = document.getElementById('aj-msg'); m2.className = 'tag ok'; m2.textContent = 'Ajustes salvos.';
    }
    if (a === 'pnovo') return abrirProfissional(null);
    if (a === 'pedit') return abrirProfissional(S.profDet.find(x => x.id === id));
    if (a === 'dmes' || a === 'rmes') {
      const o = a === 'dmes' ? S.despMes : S.rel, d = new Date(o.ano, o.mes + Number(b.dataset.d), 1);
      o.ano = d.getFullYear(); o.mes = d.getMonth(); return renderTab();
    }
    if (a === 'rano') { S.rel.ano += Number(b.dataset.d); return renderTab(); }
    if (a === 'rmodo') { S.rel.modo = b.dataset.m; return renderTab(); }
    if (a === 'dsalvar') {
      const err = document.getElementById('d-err'); err.textContent = '';
      const valor = parseValor(document.getElementById('d-valor').value), data = document.getElementById('d-data').value;
      if (!data) return err.textContent = ERROS.data_invalida;
      if (!valor) return err.textContent = 'Digite o valor da despesa.';
      try {
        await rpc('dono_salvar_despesa', {p_token: S.token, p_id: null, p_data: data, p_categoria: document.getElementById('d-cat').value,
                                          p_descricao: document.getElementById('d-desc').value.trim(), p_valor: valor});
      } catch (ex) { if (!adminErr(ex)) err.textContent = msgErro(ex); return; }
      const d = parseDia(data); S.despMes = { ano: d.getFullYear(), mes: d.getMonth() };
      await carregarDesp(); return renderTab();
    }
    if (a === 'dexcluir') {
      if (!confirm('Excluir esta despesa?')) return;
      await rpc('dono_excluir_despesa', {p_token: S.token, p_id: id});
      await carregarDesp(); return renderTab();
    }
    if (a === 'assinar') {
      const err = document.getElementById('mp-err'), email = document.getElementById('mp-email').value.trim();
      err.className = 'err'; err.textContent = '';
      if (b.dataset.p === S.conta.plano && S.conta.mp_status === 'authorized') return err.textContent = 'Esse já é o seu plano atual.';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = ERROS.email_invalido; document.getElementById('mp-email').focus(); return; }
      b.disabled = true; b.textContent = 'Abrindo o Mercado Pago…';
      try {
        const r = await chamarAssinatura({ plano: b.dataset.p, email, volta: linkDe(SHOP.slug, 'dono') });
        if (r.link) { location.href = r.link; return; }
        err.textContent = ERROS.mp_recusou;
      } catch (ex) { if (!adminErr(ex)) err.textContent = msgErro(ex); }
      b.disabled = false; b.textContent = 'Tentar de novo'; return;
    }
    if (a === 'cancelar-assin') {
      if (!confirm('Cancelar a cobrança automática? O sistema continua liberado até a data já paga.')) return;
      await chamarAssinatura({ acao: 'cancelar' });
      await carregarConta(); shell(); return renderTab();
    }
  } catch (ex) { if (!adminErr(ex)) alert(msgErro(ex)); }
}

const P = { token: null, lista: [], criada: null };
const slugify = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/g, '');

function platErr(e){
  if (e && e.code === 'nao_autorizado') { SS.del('bb_plat'); P.token = null; platLogin('Sua sessão expirou. Entre de novo.'); return true; }
  console.error(e); return false;
}

function platView(){
  P.token = SS.get('bb_plat');

  platPainel();
}

function platLogin(aviso = ''){
  $app.className = ''; $app.onclick = null;
  $app.innerHTML = `<div class="logo">🗂️</div><h1>Plataforma</h1>

  const go = async () => {
    const pw = document.getElementById('ppw').value, err = document.getElementById('err');

    try {

      SS.set('bb_plat', t); P.token = t; platPainel();

      <div class="err" id="plat-msg"></div>
      <button class="btn sm" style="margin-top:12px" data-p="trocar">Salvar</button></div>`;
  const nome = document.getElementById('n-nome'), slug = document.getElementById('n-slug'), prev = document.getElementById('n-prev');

  slug.addEventListener('input', () => { slugManual = true; slug.value = slugify(slug.value) + (slug.value.endsWith('-') ? '-' : ''); mostrar(); });

async function onPlatClick(e){
  const b = e.target.closest('[data-p]'); if (!b) return;
  const a = b.dataset.p;
  try {
    if (a === 'sair') { SS.del('bb_plat'); P.token = null; P.criada = null; return platLogin(); }
    if (a === 'criar') {
      const err = document.getElementById('n-err'); err.textContent = '';
      const nome = document.getElementById('n-nome').value.trim(), slug = slugify(document.getElementById('n-slug').value);
      const pd = document.getElementById('n-pd').value, pb = document.getElementById('n-pb').value;
      if (nome.length < 2) return err.textContent = 'Informe o nome da barbearia.';
      if (!slug) return err.textContent = ERROS.slug_invalido;
      if (pd.length < 6 || pb.length < 6) return err.textContent = ERROS.senha_curta;
      if (pd === pb) return err.textContent = ERROS.senha_repetida;
      try { await rpc('plat_criar', {p_token: P.token, p_slug: slug, p_nome: nome, p_pin_dono: pd, p_pin_barbeiro: pb, p_plano: document.getElementById('n-plano').value}); }
      catch (ex) { if (!platErr(ex)) err.textContent = msgErro(ex); return; }
      P.criada = slug; window.scrollTo(0, 0); return platPainel();
    }
    if (a === 'plano' || a === 'isento') {
      const id = Number(b.dataset.id), item = P.lista.find(x => x.id === id);
      await rpc('plat_plano', {p_token: P.token, p_id: id, p_plano: a === 'plano' ? document.getElementById('pl-' + id).value : item.plano,
                               p_isento: a === 'isento' ? b.dataset.v === '1' : item.isento});
      return platPainel();
    }
    if (a === 'liberar') {
      const id = Number(b.dataset.id), item = P.lista.find(x => x.id === id);
      const dias = prompt(`Pagamento recebido fora do app (ex.: Pix direto) de "${item ? item.nome : ''}". Liberar quantos dias?`, '30');
      if (dias === null) return;
      const n = parseInt(dias, 10); if (!(n >= 1 && n <= 400)) return alert(ERROS.dias_invalidos);
      await rpc('plat_liberar', {p_token: P.token, p_id: id, p_dias: n, p_valor: null});
      return platPainel();
    }
    if (a === 'preco') {
      const msg = document.getElementById('preco-msg'), v = parseValor(document.getElementById('pp-' + b.dataset.c).value);
      msg.className = 'err'; msg.textContent = '';
      if (!v || v < 1) return msg.textContent = 'Preço inválido.';
      await rpc('plat_preco', {p_token: P.token, p_codigo: b.dataset.c, p_preco: v});
      return platPainel();
    }
    if (a === 'ativo') {
      const id = Number(b.dataset.id), ativar = b.dataset.v === '1', item = P.lista.find(x => x.id === id);
      if (!ativar && !confirm(`Desativar "${item ? item.nome : ''}"? Clientes e barbeiro deixam de acessar até você reativar. Os dados ficam guardados.`)) return;
      await rpc('plat_ativar', {p_token: P.token, p_id: id, p_ativo: ativar});
      return platPainel();
    }
    if (a === 'senha') {
      const id = Number(b.dataset.id), quem = b.dataset.quem, item = P.lista.find(x => x.id === id);
      const novo = prompt(`Nova senha do ${quem} de "${item ? item.nome : ''}" (mínimo 6 caracteres):`);
      if (novo === null) return;
      const msg = document.getElementById('lista-msg'); msg.className = 'err'; msg.textContent = '';
      if (novo.length < 6) return msg.textContent = ERROS.senha_curta;
      await rpc('plat_redefinir', {p_token: P.token, p_id: id, p_quem: quem, p_novo: novo});
      msg.className = 'tag ok'; msg.textContent = `Senha do ${quem} trocada. Avise a pessoa.`;
      return;
    }
    if (a === 'trocar') {
      const inp = document.getElementById('np-plat'), msg = document.getElementById('plat-msg');
      msg.className = 'err'; msg.textContent = '';
      if (inp.value.length < 8) return msg.textContent = ERROS.senha_curta_plat;
      const novo = inp.value;
      await rpc('plat_trocar_senha', {p_token: P.token, p_novo: novo});
      const t = await rpc('plat_login', {p_pin: novo});
      if (!t) { SS.del('bb_plat'); return platLogin(); }
      P.token = t; SS.set('bb_plat', t); inp.value = '';
      msg.className = 'tag ok'; msg.textContent = 'Senha da plataforma salva.';
    }
  } catch (ex) {
    if (platErr(ex)) return;
    const msg = document.getElementById('lista-msg');
    if (msg) { msg.className = 'err'; msg.textContent = msgErro(ex); } else alert(msgErro(ex));
  }
}

route();
</script>
